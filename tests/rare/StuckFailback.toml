[[knobs]]
cc_bme_trigger_recovery = false
min_trace_severity = 10

[configuration]
generateFearless = true
processesPerMachine = 1
machineCount = 20
minimumRegions = 2

[[test]]
testTitle = 'StuckFailback'
connectionFailuresDisableDuration = 100000 # disable any network connection failures which can happen outside buggify or fault injection workloads

    [[test.workload]]
    testName = 'StuckFailback'
    testDuration = 1000.0

    [[test.workload]]
    testName = 'Cycle'
    nodeCount = 3000
    transactionsPerSecond = 250.0
    testDuration = 1000.0
    expectedRate = 0
